[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Erreurs, PEP 8, imports, nommage, bugbear, simplifications
select = ["E", "W", "F", "I", "N", "B", "SIM", "UP"]
# N818 impose le suffixe anglais « Error » aux exceptions ; le code métier
# est en français (ErreurDomaine, AccesRefuse...).
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -rs : affiche la raison des tests ignorés (base de test absente...)
addopts = "-q -rs"
markers = [
    "base: test qui nécessite PostgreSQL (TEST_DATABASE_URL)",
]
